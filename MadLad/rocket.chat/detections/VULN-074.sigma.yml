title: 'Rocket.Chat: unknown method name on the anonymous DDP bridge (metric cardinality)'
id: 8d3b1f6f-115a-57f8-ab61-d7d8ce04b829
status: experimental
description: |
  An anonymous call naming a Meteor method this build's own client never
  calls. Each distinct path becomes a new label on the method.call metric series with
  nothing evicting it, so unauthenticated requests grow the registry until the process
  runs out of memory (the finding's proof: 300 requests added 7,774 time series and a
  megabyte of metrics body).
  What to do: count the distinct method names from the source address: a handful is a
  misconfigured client, hundreds is the cardinality attack. Block the source and restart
  the workspace to drop the accumulated series, and keep the metrics endpoint off
  (Prometheus_Enabled=false) or behind authentication.
  The filter lists the methods the shipped client calls before login, from
  connection.ts:58, CachedStore.ts:146 and packages/ui-registration; a new client version
  that calls another one would have to be added to it.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://kohirc.com
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri-stem|startswith: /api/v1/method.callAnon/
  filter:
    cs-uri-stem:
      - /api/v1/method.callAnon/login
      - /api/v1/method.callAnon/getServerInfo
      - /api/v1/method.callAnon/logout
      - /api/v1/method.callAnon/resetPassword
      - /api/v1/method.callAnon/checkRegistrationSecretURL
      - /api/v1/method.callAnon/getRoomByTypeAndName
      - /api/v1/method.callAnon/public-settings%3Aget
      - /api/v1/method.callAnon/private-settings%3Aget
      - /api/v1/method.callAnon/permissions%3Aget
      - /api/v1/method.callAnon/rooms%3Aget
      - /api/v1/method.callAnon/subscriptions%3Aget
  condition: selection and not filter
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - 'A client version or a third-party integration that calls a method the filter does not list: the filter is this build''s shipped set, not every method'
  - Authorised security testing of this application
level: high
blue_spider:
  finding: VULN-074
  target: rocket.chat
  product: Rocket.Chat
