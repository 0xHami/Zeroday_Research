title: 'Rocket.Chat: Livechat transcript mailed to a caller-named address'
id: 1f3c917e-0db2-5b6c-a4e7-82b54529e391
status: experimental
description: |
  A request to mail a Livechat transcript. The route takes the recipient
  from the caller and relays the conversation, including visitor-written HTML carried in an
  upload description, from the workspace's own mail address, so an anonymous visitor makes
  the workspace send attacker-authored markup with a working link to any third party.
  What to do: treat it as outbound phishing from your own domain. Check the mail sink or
  relay for what was sent and to whom, and look at the conversation's uploads for HTML in
  their descriptions.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://github.com/RocketChat/Rocket.Chat/issues/42432
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri-stem: /api/v1/livechat/transcript
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - An agent or a visitor legitimately asking for a chat transcript by email, which is what this route is for
  - 'On a workspace that runs Omnichannel this route belongs to the Livechat widget, and the rule then fires on ordinary visitor traffic: the attack is separated only by the request body'
level: medium
blue_spider:
  finding: VULN-051
  target: rocket.chat
  product: Rocket.Chat
  limitation: 'the payload is in the request body, which a web server does not log: this rule detects the request reaching the route, and application or proxy logs are needed to see the payload'
