title: 'Rocket.Chat: channels.anonymousread serving Omnichannel and deleted content'
id: 78fb731d-24ac-51ca-ad81-883d5de45976
status: experimental
description: |
  An unauthenticated read through the anonymous-read route. It serves any
  room id it is given, Omnichannel conversations included, and returns messages the
  room's own history withholds (a deleted message's hidden copy), so a caller with no
  credentials reads customer support conversations by id.
  What to do: anonymous read is off by default here (Accounts_AllowAnonymousRead=false), so
  a hit means someone is calling the route regardless; check the roomId in the query
  against your Omnichannel rooms and treat the content as disclosed. If the setting is on,
  confirm it was meant to be.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://kohirc.com
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: GET
    cs-uri-stem: /api/v1/channels.anonymousread
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - 'A workspace that deliberately enables Accounts_AllowAnonymousRead to publish a channel: the route is then its own public reader'
  - Authorised security testing of this application
level: medium
