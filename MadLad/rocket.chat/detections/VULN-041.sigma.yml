title: 'Rocket.Chat: channels.messages filtered by starredIds (star privacy bypass)'
id: 0c5f4116-9a99-5be6-af7d-0004e937c91b
status: experimental
description: |
  A message query filtered on another member's stars. Star privacy is
  applied only by the REST serializer, so the query filter still answers from the raw
  starred array: an empty answer and a hit distinguish whether a given user starred a
  given message, and the realtime broadcast carries the array itself.
  What to do: no first-party client sends this parameter (the web client reads stars
  through chat.getStarredMessages), so a hit is someone reading other people's stars.
  Identify the caller and the room; the starredIds value names the account whose stars
  were queried.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://kohirc.com
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: GET
    cs-uri-stem: /api/v1/channels.messages
    cs-uri-query|contains: starredIds=
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
