title: 'Rocket.Chat: chat.getDeletedMessages called for a room the caller may not read'
id: 1db8b347-9fde-514d-a556-bc0437b8d14a
status: experimental
description: |
  A request to the deleted-message sync route. The route has no
  authorization check of its own, so any signed-in account lists the ids, count and
  timing of the deleted messages of any room, including a private group it is refused
  every other way.
  What to do: no first-party client in this build calls this route (the web client has no
  caller at all), so a hit is either a third-party client or someone enumerating rooms.
  Compare the roomId in the query against the rooms the caller belongs to; a caller
  walking several roomIds is harvesting.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://github.com/RocketChat/Rocket.Chat/issues/42481
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: GET
    cs-uri-stem: /api/v1/chat.getDeletedMessages
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - 'A third-party, mobile or desktop client that syncs deleted messages: no first-party caller exists in this build, so this workspace''s own clients do not produce it'
  - A backup or compliance integration reading deletion metadata
level: medium
blue_spider:
  finding: VULN-010
  target: rocket.chat
  product: Rocket.Chat
