title: 'Rocket.Chat: Livechat webhook test fired (server-side request forgery)'
id: b4cd8b7a-60a1-558c-ad71-ea09def60c2a
status: experimental
description: |
  The Omnichannel webhook test route was called. It sends the configured
  webhook URL with the SSRF guard disabled (ignoreSsrfValidation stays on), for the same
  non-admin Omnichannel roles PR #42201 stopped from reaching it elsewhere, so a
  livechat-manager makes the server fetch a URL of its choosing, including hosts only the
  server can reach, and receives the conversation data at its own listener.
  What to do: read the currently configured LivechatWebhookUrl (Admin > Omnichannel >
  Webhooks) and compare it with what you expect: the call before this one usually sets it.
  Treat any internal or unexpected address as an SSRF target and check what that host
  received.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://github.com/RocketChat/Rocket.Chat/pull/42201
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri-stem: /api/v1/livechat/webhook.test
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - An administrator genuinely testing a newly configured Omnichannel webhook, which is what the button does
  - 'On a workspace that runs Omnichannel this route belongs to the Livechat widget, and the rule then fires on ordinary visitor traffic: the attack is separated only by the request body'
level: medium
blue_spider:
  finding: VULN-081
  target: rocket.chat
  product: Rocket.Chat
  limitation: 'the payload is in the request body, which a web server does not log: this rule detects the request reaching the route, and application or proxy logs are needed to see the payload'
