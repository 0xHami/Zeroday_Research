title: 'Rocket.Chat: anonymous Livechat visitor registration (visitor-token IDOR)'
id: 41c17d9a-d020-5f15-ae6b-73f310502e29
status: experimental
description: |
  An unauthenticated POST to the Livechat visitor-registration route. The
  route looks a visitor up by the phone number or email address in the body and returns
  that visitor's token, so a caller who knows a customer's phone number receives their
  Livechat token and can read the conversation, and the same call with their email address
  rebinds the record to the caller.
  What to do: this workspace has Omnichannel off by default, so any hit is a caller
  reaching a disabled feature: treat it as hostile, and check the source address against
  the other livechat.* rules in this set. Where Omnichannel is in use, correlate with the
  visitor tokens the source went on to read (/api/v1/livechat/room?token=,
  /api/v1/livechat/messages.history/...) and with the body, which needs request-payload
  logging (LOG_REST_PAYLOAD=true) or proxy capture.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://kohirc.com
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri-stem: /api/v1/livechat/visitor
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - 'On a workspace that runs Omnichannel this route belongs to the Livechat widget, and the rule then fires on ordinary visitor traffic: the attack is separated only by the request body'
  - Authorised security testing of this application
  - A monitoring probe that registers a synthetic visitor
level: high
blue_spider:
  finding: VULN-001
  target: rocket.chat
  product: Rocket.Chat
  limitation: 'the payload is in the request body, which a web server does not log: this rule detects the request reaching the route, and application or proxy logs are needed to see the payload'
