title: 'Rocket.Chat: Livechat offline form submitted (unescaped HTML into the support mailbox)'
id: 8c874c9f-9a0a-5e99-a893-f6193d847839
status: experimental
description: |
  An anonymous submission of the Omnichannel offline form. The visitor's
  name, message and host fields are interpolated into the notification email unescaped, and
  the host field lands inside an href, so the mail the support mailbox receives from the
  workspace's own address carries attacker-authored HTML and an attacker-chosen link.
  What to do: check what arrived in the offline-message mailbox and warn its readers; the
  mail is genuine, which is what makes it effective. The fields are in the request body.
author: Blue Spider
date: 2026-11-24
license: DRL-1.1
references:
  - https://kohirc.com
tags:
  - attack.initial-access
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri-stem: /api/v1/livechat/offline.message
  condition: selection
fields:
  - c-ip
  - cs-method
  - cs-uri
  - sc-status
  - cs-user-agent
falsepositives:
  - 'A visitor legitimately submitting the offline form, which is this route''s whole purpose: on a workspace that offers the form, every submission matches'
  - 'On a workspace that runs Omnichannel this route belongs to the Livechat widget, and the rule then fires on ordinary visitor traffic: the attack is separated only by the request body'
level: medium
blue_spider:
  finding: VULN-054
  target: rocket.chat
  product: Rocket.Chat
  limitation: 'the payload is in the request body, which a web server does not log: this rule detects the request reaching the route, and application or proxy logs are needed to see the payload'
